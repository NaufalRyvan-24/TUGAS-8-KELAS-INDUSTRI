<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naufal Ryvan N. Z. | Kalkulator Nilai</title>
  <link rel="icon" href="img/NAUFAL.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
  <script src="js/script.js" defer></script>
</head>
<body>
  <header>
    <div class="container navbar">
      <h1>Naufal Ryvan N. Z.</h1>
      <nav aria-label="Navigasi utama">
        <a href="index.html">Beranda</a>
        <a href="proyek.html">Proyek</a>
        <a href="kontak.html">Kontak</a>
        <a href="kalkulator.html" aria-current="page">Kalkulator</a>
      </nav>
      <button type="button" id="tombol-tema" class="tombol-tema">Mode Gelap</button>
    </div>
  </header>

  <main class="container">
    <section class="kartu">
      <h2>Kalkulator Nilai Rapor</h2>
      <p class="keterangan">Isi nilai tugas, UTS, dan UAS (0–100). Rata-rata, predikat, dan status KKM dihitung otomatis.</p>

      <form id="formNilai" novalidate>
        <div class="baris-isian">
          <label for="tugas">Nilai tugas</label>
          <input type="number" id="tugas" name="tugas" min="0" max="100" step="0.1" inputmode="decimal" placeholder="85" autocomplete="off">
        </div>
        <div class="baris-isian">
          <label for="uts">Nilai UTS</label>
          <input type="number" id="uts" name="uts" min="0" max="100" step="0.1" inputmode="decimal" placeholder="78" autocomplete="off">
        </div>
        <div class="baris-isian">
          <label for="uas">Nilai UAS</label>
          <input type="number" id="uas" name="uas" min="0" max="100" step="0.1" inputmode="decimal" placeholder="89" autocomplete="off">
        </div>

        <div class="aksi">
          <button type="submit" id="btnHitung" class="tombol">Hitung</button>
          <button type="reset" id="btnReset" class="tombol-reset">Kosongkan isian</button>
        </div>
      </form>

      <p id="pesan" class="pesan" role="alert" hidden></p>

      <dl id="hasil" class="hasil" aria-live="polite">
        <div class="hasil-baris">
          <dt>Rata-rata</dt>
          <dd id="nilaiRataRata" class="teks-kosong">belum dihitung</dd>
        </div>
        <div class="hasil-baris">
          <dt>Predikat</dt>
          <dd id="nilaiPredikat" class="teks-kosong">belum dihitung</dd>
        </div>
        <div class="hasil-baris">
          <dt>Status</dt>
          <dd id="nilaiStatus" class="teks-kosong">belum dihitung</dd>
        </div>
      </dl>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2026 Naufal Ryvan N. Z. Hak cipta dilindungi.</p>
    </div>
  </footer>
</body>
</html>
