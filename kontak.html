<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naufal Ryvan N. Z. | Kontak</title>
  <link rel="icon" href="img/foto-profil.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>
<body>
  <header>
    <div class="container navbar">
      <h1>Naufal Ryvan N. Z.</h1>
      <nav>
        <a href="index.html">Beranda</a>
        <a href="proyek.html">Proyek</a>
        <a href="kontak.html">Kontak</a>
        <a href="kalkulator.html">Kalkulator</a>
      </nav>
      <!-- Tombol Mode Gelap (Modul P1-W07) -->
      <button type="button" id="tombol-tema" class="tombol-tema">Mode Gelap</button>
    </div>
  </header>

  <main class="container">
    <section class="kartu">
      <h2>Hubungi Saya</h2>
      <p>Punya pertanyaan atau ingin bekerja sama? Isi form berikut.</p>
      
      <form>
        <label for="nama">Nama lengkap</label><br>
        <input type="text" id="nama" name="nama" placeholder="Contoh: Naufal Ryvan" required><br><br>

        <label for="email">Email</label><br>
        <input type="email" id="email" name="email" placeholder="naufalrifan85@gmail.com" required><br><br>

        <label for="hp">Nomor HP</label><br>
        <input type="tel" id="hp" name="hp" placeholder="085746130713"><br><br>

        <label for="keperluan">Keperluan</label><br>
        <select id="keperluan" name="keperluan">
          <option value="">-- Pilih keperluan --</option>
          <option value="kerjasama">Kerja Sama</option>
          <option value="tanya">Pertanyaan</option>
        </select><br><br>

        <label for="pesan">Pesan</label><br>
        <!-- Textarea dengan maxlength 300 (Modul P1-W07) -->
        <textarea id="pesan" name="pesan" rows="5" cols="40" maxlength="300" placeholder="Tulis pesanmu di sini" required></textarea><br>
        <!-- Span Penghitung Karakter (Modul P1-W07) -->
        <span id="hitung-karakter" class="keterangan">0/300 karakter</span><br><br>

        <button type="submit" class="tombol">Kirim Pesan</button>
      </form>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2026 Naufal Ryvan N. Z. Hak cipta dilindungi.</p>
    </div>
  </footer>
</body>
</html>
